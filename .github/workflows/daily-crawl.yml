name: 데일리 건강기능식품 판매순위 수집

on:
  schedule:
    # 깃허브 예약 실행은 무료 저장소에서 5~7시간씩 늦게 시작되고 가끔은 아예 건너뛴다
    # (9~11월 실제 기록: 09:37 예약 → 실제 14:00~16:40 KST 실행). 그래서 하루에 세 번
    # 걸어두고, 각 크롤러는 오늘 파일이 이미 있으면 건너뛰게 했다(먼저 도는 실행이 수집,
    # 나중 실행은 실패한 사이트만 재시도). 7시간 늦어져도 같은 한국 날짜 안에서 끝나도록
    # UTC 00:37 / 03:37 / 06:37 (= KST 09:37 / 12:37 / 15:37).
    - cron: "37 0 * * *"
    - cron: "37 3 * * *"
    - cron: "37 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# 두 실행이 겹쳐 같은 파일을 동시에 커밋하지 않도록
concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  crawl:
    # ubuntu-latest는 2026-10부터 Ubuntu 26으로 바뀌는 중 — Playwright 의존성 설치가
    # 깨질 수 있어 검증된 24.04로 고정
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 라이브러리 설치
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 크롤러 실행 (실패한 사이트는 1분 뒤 한 번 더, 사이트 하나가 실패해도 나머지는 계속)
        run: |
          set +e
          FAILED=""
          for s in crawl_kakao_gift crawl_daiso crawl_oliveyoung; do
            python scripts/$s.py || FAILED="$FAILED $s"
          done
          if [ -n "$FAILED" ]; then
            echo "재시도 대상:$FAILED"
            sleep 60
            STILL=""
            for s in $FAILED; do
              python scripts/$s.py || STILL="$STILL $s"
            done
            if [ -n "$STILL" ]; then
              echo "::warning::오늘 수집 실패:$STILL (다음 예약 실행에서 다시 시도)"
              exit 1
            fi
          fi

      - name: 대시보드용 데이터(latest.json) 생성
        if: always()
        run: python scripts/build_dashboard_data.py

      - name: 월간 리포트 데이터 생성
        if: always()
        run: python scripts/build_monthly_report.py

      - name: 추세·판촉·동시진입 분석 데이터(insights.json) 생성
        if: always()
        run: python scripts/build_insights.py

      - name: 결과 커밋 및 푸시
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw data/latest.json data/monthly data/insights.json
          git diff --cached --quiet || git commit -m "데일리 수집: $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') KST"
          git pull --rebase origin main
          git push
